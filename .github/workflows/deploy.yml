name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build site
        run: npm run build

      - name: Backup current site on server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/id_deploy \
              -o StrictHostKeyChecking=accept-new \
              -o BatchMode=yes \
              "$SSH_USERNAME@$SSH_HOST" \
              "bash \$HOME/scripts/backup-wiki.sh"

      - name: Deploy to Netcup server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # If rsync is available on the server, use this (fast, supports --delete):
          # rsync -avz --delete \
          #   -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new" \
          #   ./dist/ \
          #   "${SSH_USERNAME}@${SSH_HOST}:${DEPLOY_PATH}"

          # Fallback: atomic tar-over-ssh (no rsync required on server)
          # Strip trailing slash so .new is a sibling, not a child, of the deploy dir
          DEPLOY_DIR="${DEPLOY_PATH%/}"
          tar -czf - -C ./dist . | \
            ssh -i ~/.ssh/id_deploy \
                -o StrictHostKeyChecking=accept-new \
                -o BatchMode=yes \
                "${SSH_USERNAME}@${SSH_HOST}" \
                "set -e; rm -rf '${DEPLOY_DIR}.new' && mkdir -p '${DEPLOY_DIR}.new' && tar -xzf - -C '${DEPLOY_DIR}.new' && rm -rf '${DEPLOY_DIR}' && mv '${DEPLOY_DIR}.new' '${DEPLOY_DIR}'"
